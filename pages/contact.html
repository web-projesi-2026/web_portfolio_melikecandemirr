<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | Tech-Timeline</title>
    <link rel="stylesheet" href="../assests/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">⚙️</span>
                <div class="logo-text"><h1>TECH-TIMELINE</h1><p>Dijital Müze</p></div>
            </div>
            <nav class="navigation">
                <div class="menu-toggle" id="mobile-menu"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
                <ul class="nav-menu">
                    <li><a href="../index.html" class="nav-link">Ana Sayfa</a></li>
                    <li><a href="about.html" class="nav-link">Hakkımda</a></li>
                    <li><a href="project.html" class="nav-link">Projeler</a></li>
                    <li><a href="contact.html" class="nav-link active">İletişim</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="padding: 3rem 15%;">
        <div class="form-box" style="border-top: 5px solid var(--dark-green);">
            <h2 style="color: var(--dark-green); text-align: center; margin-bottom: 2rem;">📬 Dijital Müze İletişim Formu</h2>
            <form onsubmit="event.preventDefault(); alert('Mesajınız başarıyla iletildi! 🤗');" style="display: flex; flex-direction: column; gap: 10px;">
                <div class="form-group"><span>👤</span><input type="text" placeholder="Adınız Soyadınız" required></div>
                <div class="form-group"><span>📧</span><input type="email" placeholder="E-posta Adresiniz" required></div>
                <div class="form-group"><span>📝</span><textarea placeholder="Mesajınız..." required style="height: 120px;"></textarea></div>
                <button type="submit" style="background: var(--dark-green); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer;">Gönder 🚀</button>
            </form>
        </div>
    </main>

    <footer class="footer"><p>&copy; 2026 Melike Candemir | Ahi Evran Üniversitesi</p></footer>
    <script src="../assests/js/main.js"></script>
</body>
</html>
