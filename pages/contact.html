<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkileşim Merkezi | Tech-Timeline</title>
    <link rel="stylesheet" href="../assests/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo"><h1>TECH-TIMELINE</h1></div>
            <nav class="navigation">
                <ul class="nav-menu">
                    <li><a href="../index.html" class="nav-link">Ana Sayfa</a></li>
                    <li><a href="about.html" class="nav-link">Hakkımda</a></li>
                    <li><a href="project.html" class="nav-link">Projeler</a></li>
                    <li><a href="javascript:void(0)" onclick="openModal('contactModal')" class="nav-icon">📞</a></li>
                    <li><a href="javascript:void(0)" onclick="openModal('visitorModal')" class="nav-icon">📖</a></li>
                    <li><a href="javascript:void(0)" onclick="openModal('suggestModal')" class="nav-icon">💡</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contact-main" style="padding: 10rem 10% 5rem; text-align: center;">
        <h2 style="font-size: 3rem; color: var(--dark-green);">Etkileşim Merkezi</h2>
        <div class="hero-buttons">
            <a href="project.html" class="btn btn-primary">💻 Keşfetmeye Başla</a>
            <a href="javascript:void(0)" onclick="openModal('contactModal')" class="btn btn-primary">✨ Bize Ulaşın 🤗</a>
        </div>
        
        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px; margin-top: 6rem;">
            <div class="stat-card"><h3>1,240+</h3><p>Ziyaretçi</p></div>
            <div class="stat-card"><h3>85</h3><p>Eser</p></div>
            <div class="stat-card"><h3>420</h3><p>Öneri</p></div>
        </div>
    </main>

    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('contactModal')">&times;</span>
            <h2>📞 İletişim Formu</h2>
            <form id="contact-form">
                <div class="form-group"><label>E-posta *</label><input type="email" required></div>
                <div class="form-group"><label>Tarih</label><input type="date"></div>
                <div class="form-group"><label>Mesajınız *</label><textarea rows="3" required></textarea></div>
                <div class="checkbox-group"><input type="checkbox" required id="kvkk-con"><label for="kvkk-con">Onaylıyorum.</label></div>
                <button type="submit" class="btn btn-primary">Gönder ✉️</button>
            </form>
        </div>
    </div>

    <footer class="footer"><p>&copy; 2026 Melike Candemir</p></footer>
    <script>
        function openModal(id) { document.getElementById(id).style.display = "block"; }
        function closeModal(id) { document.getElementById(id).style.display = "none"; }
    </script>
</body>
</html>
